; MGS4CRT - MGS4 on screens narrower than 16:9 (the NEC CRT): the 3D fills the whole tube
; and the 16:9 HUD keeps its proper shape, anchored to the tube's top and bottom edges.
; Does nothing on 16:9 or wider screens. Edits are picked up while the game runs
; (within about a second).

[HUD]
; 0 turns the whole plugin off.
Enabled = 1

; 1 stops the game from re-centring and trapping the desktop cursor on its window, so the
; mouse can be used on the other monitor without the game grabbing focus back. The game
; still reads the mouse (raw input). Works on any screen; takes effect on the next launch.
FreeMouse = 0

; 1 shows the whole screen instead of the game's 16:9 letterbox. The 3D is already
; rendered at the tube's own 5:4 shape, so this is a true fill, not a stretch.
FillScreen = 1

; 1 gives the 2D its proper 16:9 shape. Every sprite's real on-screen box is read from its
; vertices: HUD elements are fitted as a whole (near the top: kept at the top edge, near
; the bottom: at the bottom edge, in the middle: around their own position), menu panels,
; texts and the selection frame are fitted one by one, panels reaching the screen edge keep
; reaching the tube's edge, and full-screen overlays are left alone. Item/weapon menus grow
; out of their boxes at the bottom. 0 leaves the HUD stretched to the tube's height.
AnchorHUD = 1

; Screens without the gameplay HUD (pause menu and its screens, Load, codec, title):
;   Center  - the game's own 16:9 layout in the middle, full-screen backgrounds fill the tube
;   Stretch - the whole screen stretched to the tube, as the game draws it
;             (the Load screen always stays centred)
FullScreenMenus = Stretch

; The Save screens from the pause menu:
;   Center  - the Mk. II frame fills the tube, the Save window keeps its shape in the middle
;   Stretch - stretched like the other pause screens
SaveScreen = Stretch

; Stretch only: bends the stretch instead of stretching evenly (like a TV's panoramic
; mode). The middle of the screen keeps closer to its true shape and the extra stretch goes
; into the top and bottom edges; backgrounds still fill the tube and texts stay in their
; panels. 0 = plain stretch, 100 = true shape in the very middle. Switches live.
PanoramicStretch = 0

; How far from the middle (0 = middle, 1 = edge) an element has to sit before it is fitted
; to an edge.
AnchorThreshold = 0.5

[FOV]
; Field of view hotkeys, live while the game window has focus (any screen, CRT or main).
; Each tap zooms the view out (Wider) or in (Narrower) by FovStep percent (1% is about half
; a degree), the same in every camera, aiming and cutscenes included; hold a key to keep
; going. Both keys together go back to the game's own. The result is saved below when you
; let go, one value per screen. F1-F24, or blank for none.
; Sunny Side Up uses F9 for its frame rate clamp, so avoid that one.
NarrowerHotkey = F10
WiderHotkey = F11
FovStep = 1

; Per screen: 0 keeps the real-time cutscenes at the game's own framing (they still fill
; the screen; the view changes when a cutscene starts or ends); 1 applies the field of
; view to them too. Going to 0 on a screen takes effect on the next launch there.
CutsceneFovCRT = 0
CutsceneFovMain = 1

; Percent of the game's own field of view (100 = stock, about 58 degrees across; 110 is
; about 63), set by the hotkeys. 50 to 200.
FovCRT = 100
FovMain = 100

[Graphics]
; Ported from MGSPatriotFix by ShizCalev/Afevis (MIT License): motion blur switch by
; cipherxof, shadow resolution by Emoose. Any screen.

; Textures the game filters at 8x anisotropic get this instead (sharper at a distance and
; at angles). 16 is the most; 0 or 8 leaves the game's own. Takes effect on next launch.
AnisotropicFiltering = 16

; The game's motion blur, per screen (1 on, 0 off). On the CRT it smooths 60 fps motion
; on a display that flashes each frame; on the LCD at high frame rates it only smears.
; Switches live.
MotionBlurCRT = 1
MotionBlurMain = 0

; All shadows at this resolution, per screen (the game mixes 512, 1024 and 2048). 512,
; 1024, 2048 or 4096 (sharpest, costs the most GPU); 0 leaves the game's own. The CRT runs
; at 60 fps with room to spare; Main stays at 2048 to keep its high frame rate. Takes
; effect when a level loads.
ShadowResolutionCRT = 4096
ShadowResolutionMain = 2048
